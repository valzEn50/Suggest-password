<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/style.css">
    <title>Password</title>
    <style type="text/css">
    *{
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      color: rgba(230,230,255,1);
    }
    body{
      height: 100vh;
      background-color: rgba(10,10,10,1);
    }
    .title{
      color: rgba(230,230,255,1);
      text-align: center;
      margin: 12px;
    } 
    .program-con{
      background-color: rgba(8,8,8,.1);
      text-align: center;
      min-width: 400px;
      margin-inline: 8px;
      padding: 18px 0;
      border-radius: 10px;
      box-shadow: -10px 0 20px rgba(20,20,20,1);
      margin: 0 8px 18px 8px;
    }
    .program-con #pass{
      padding-left: 20px;
      background-color: rgba(30,30,30,1);
      border: none;
      height: 35px;
      width: 200px;
      color: rgba(230,230,255,1);
      font-size: 1em;
      font-weight: bold;
    }
    .program-con button{
      border: none;
      outline: none;
      background-color: rgba(50,50,73,1);
      width: auto;
      padding: 10px 5px;
      margin: 7px 14px;
      font-size: 1em;
      
    }
    .program-con #pass, button {
      border-radius: 5px;
      padding-inline: 5px;
    }
    #suggested{
      color: rgba(230,230,255,1);
      font-size: 1.2em;
      font-weight: bold;
      margin-block: 18px;
      text-align: left;
      margin-left: 8px;
    }
    .case-con{
      background-color: rgba(8,8,8,.1);
      min-width: 400px;
      margin-inline: 8px;
      padding: 18px 18px;
      border-radius: 10px;
      box-shadow: -10px 0 20px rgba(20,20,20,1);
      margin: 0 8px 18px 8px;
    }
    .cond-sel{
      font-size: 2em;
      font-weight: bold;
      text-align: center;
      margin-bottom: 18px;
    }
    .label-con{
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .label-con input{
      appearance: none;
      display: none;
    }
    .label-con .showAdd{
      display: block;
      background-color: rgba(40,70,40,.5);
      padding: 8px 8px;
      border-radius: 4px;
      font-size: 1em;
      font-weight: bold;
      opacity: .7;
    }
    .label-con input:checked ~ .showAdd{
      opacity: 1;
      background-color: rgba(50,150,40,.5);
    }
    .lengthLabel{
      font-size: 1em;
      font-weight: bold;
    }
    #lengthCheck{
      font-size: 1em;
      text-align: center;
      font-weight: bold;
      background-color: rgba(30,30,30,1);
      border: none;
      border-radius: 5px;
      height: 35px;
      width: 100px;
      color: rgba(230,230,255,1);
      font-size: 1em;
      font-weight: bold;
      margin-right: 5px;
    }
    #invincible-suggest{
      font-size: 2em;
      color: white;
      display: none;
    }
    </style>
    </head>
    <body>
      <h1 class="title">Password Suggestion Program</h1>
      <div class="program-con">
        <input type="text"  id="pass"><br>
        <p id="suggested"></p>
        <button id="suggest" >Suggest Password</button>
        <button id="accept">Accept Password</button>
      </div>
        
        
       <div class="case-con">
        <p class="cond-sel">Include Character Type</p>
        <input type="number" id="lengthCheck">
        <label class="lengthLabel" for="lengthCheck">:Password Length</label>
        <div class="label-con">
         <label id="lowerLabel">
          <input type="checkbox" id="lowerCheck">
          <span id="addLower" class="showAdd">+ Add Lower case</span>
         </label>
         <label id="upperLabel">
          <input type="checkbox" id="upperCheck">
          <span id="addUpper" class="showAdd">+ Add Upper Case</span>
         </label>
         <label id="symbolLabel">
          <input type="checkbox" id="symbolCheck">
          <span id="addSymbol" class="showAdd">+ Add Symbol</span>
         </label>
         <label id="numberLabel">
          <input type="checkbox" id="numberCheck">
          <span id="addNumber" class="showAdd">+ Add Number</span>
         </label>
         <p id="invincible-suggest"></p>
        </div>
      </div>
        
        <script>
        let suggested = document.getElementById("suggested")
        let suggest = document.getElementById("suggest")
        let passIn = document.getElementById("pass")
        let accept = document.getElementById("accept")
        let puff = document.getElementById("invincible-suggest")
        
         function suggestPass(isLength, incLower, incUpper, incSymbol, incNumber){
           const lowerCase = "abcdefghijklmnopqrstuvwxyz";
           const upperCase = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
           const symbol = "%$#@!&@!&$#";
           const numbers = "12345678901234567890";
           
           let appendChar = "";
           let password = "";
           
           appendChar += incLower.checked ? lowerCase : "";
           appendChar += incUpper.checked ? upperCase : "";
           appendChar += incSymbol.checked ? symbol : "";
           appendChar += incNumber.checked ? numbers : "";
           
           for(i = 0; i < isLength; i++){
             let randomCheck = Math.floor(Math.random() * appendChar.length);
             password += appendChar[randomCheck];
           }
           if(isLength <= 0){
               suggested.textContent = 'Password length is too short';
           }else if(appendChar.length === 0){
              suggested.textContent = 'Choose at least one Character Type';
           }else if(isLength > 39){
            suggested.textContent = "Password is too long"
             }else {
             suggested.textContent = `Suggested Password: ${password}`;
           puff.textContent = password
           }
           
           
         }
         
          const lengthCheck = document.getElementById("lengthCheck")
          const lowerCheck = document.getElementById("lowerCheck")
          const upperCheck = document.getElementById("upperCheck")
          const symbolCheck = document.getElementById("symbolCheck")
          const numberCheck = document.getElementById("numberCheck")
          
         suggest.addEventListener('click', ()=>{
           
           passIn.value = "";
           
         suggestPass(Number(lengthCheck.value), lowerCheck, upperCheck, symbolCheck, numberCheck)
         })
          
          accept.addEventListener('click', ()=> {
            passIn.value = puff.textContent
          })
          
        </script>
    </body>
    </html>
